services:
  steg-solaire:
    build: .
    container_name: steg-solaire
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - steg-data:/app/data
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  steg-data:
    driver: local
