# Hide the Deploy button and the three-dots menu entirely (not just via CSS).
# Streamlit 1.63: "hidden" no longer exists (session crash) — use "minimal".
[client]
toolbarMode = "minimal"

[server]
runOnSave = true
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

# First-paint background (never white). Login page overrides to blue via CSS.
[theme]
base = "light"
primaryColor = "#0b3d91"
backgroundColor = "#f4f7fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2a44"
